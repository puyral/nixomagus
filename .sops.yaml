creation_rules:
  - path_regex: modules/home-manager/(ntfy|llm-clients)/.*\.sops-secret\..*$
    pgp: *gpg
    age:
    - *simon
    - *sandbox

  - path_regex: (users|modules/home-manager)/.*\.sops-secret\..*$
    pgp: *gpg
    age:
    - *simon

  - path_regex: configuration/commun/.*\.sops-secret\..*$
    pgp: *gpg
    age:
    - *dynas
    - *ovh-fr
    - *amdra
    - *mydos
    - *i7-placeholder
    - *nixomagus-placeholder
    - *sandbox-host-placeholder

  - path_regex: modules/nixos/(headscale|authelia|authentik)/.*\.sops-secret\..*$
    pgp: *gpg
    age:
    - *ovh-fr

  - path_regex: modules/nixos/(binary-cache|kavita|paperless)/.*\.sops-secret\..*$
    pgp: *gpg
    age:
    - *dynas

  - path_regex: .*\.sops-secret\..*$
    pgp: *gpg
    age:
    - *dynas
    - *ovh-fr
    - *amdra
    - *mydos
